name: Windows Cloud RDP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 1. 开启远程桌面 + 防火墙规则
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP enabled, firewall rule on"

      - name: 2. 创建管理员账号
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pwd = $env:RDP_PASSWORD
          if ([string]::IsNullOrEmpty($pwd)) { $pwd = "P@ssw0rd1qazXSW@#" }
          $sec = ConvertTo-SecureString $pwd -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $sec -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin $pwd
          Write-Host "admin account ready"

      - name: 3. 安装并连接 Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 10
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4 | Out-String).Trim()
          Write-Host "tailscale connected, ip=$ip"
          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: 4. 输出连接信息（不打印密码）
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "=========================================="
          Write-Host " RDP SERVER READY"
          Write-Host " Tailscale IP : $env:TS_IP"
          Write-Host " Username     : NvdAdmin"
          Write-Host " Password     : 见仓库 Secret RDP_PASSWORD"
          Write-Host " Connect with : mstsc -> $env:TS_IP"
          Write-Host "=========================================="

      - name: 5. 把连接信息写入仓库 status.txt
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $now = (Get-Date).ToString('yyyy-MM-dd HH:mm:ss')
          $txt = "tailscale_ip=$env:TS_IP`nusername=NvdAdmin`nrun_id=$env:GITHUB_RUN_ID`nupdated=$now`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($txt))
          $repo = $env:GITHUB_REPOSITORY
          $sha = (gh api "repos/$repo/contents/status.txt" --jq ".sha" 2>$null)
          if ($sha) {
            gh api -X PUT "repos/$repo/contents/status.txt" -f message="update rdp connection info" -f content="$b64" -f branch=main -f sha="$sha"
          } else {
            gh api -X PUT "repos/$repo/contents/status.txt" -f message="add rdp connection info" -f content="$b64" -f branch=main
          }
          Write-Host "status.txt updated"

      - name: 6. 保活循环（约5小时50分，到点由下一个定时任务接力）
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(21000)
          Write-Host "keep-alive started, ends at $deadline"
          while ((Get-Date) -lt $deadline) {
            $free = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024, 0)
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] alive | free mem: ${free}MB"
            Start-Sleep -Seconds 300
          }
