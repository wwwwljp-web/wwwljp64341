name: Gemini Key Diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: test Gemini key and generation
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_DIAG_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_DIAG_TOPIC }}
        run: |
          set +x
          payload='{"contents":[{"parts":[{"text":"只回复：Gemini通了"}]}],"generationConfig":{"maxOutputTokens":20}}'
          gen=$(curl -sS --max-time 90 -w ' HTTP_STATUS:%{http_code}' -H "x-goog-api-key: $GEMINI_KEY" -H 'Content-Type: application/json' -d "$payload" 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent')
          status=${gen##*HTTP_STATUS:}
          data=${gen% HTTP_STATUS:*}
          if [ "$status" = 200 ]; then
            text=$(printf '%s' "$data" | python3 -c 'import sys,json; d=json.load(sys.stdin); c=d.get("candidates",[{}])[0]; parts=(c.get("content") or {}).get("parts") or []; print("".join(str(p.get("text", "")) for p in parts)[:200])')
            msg="GEMINI_GENERATE=OK http=200 reply=$text"
          else
            safe=$(printf '%s' "$data" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("error",{}).get("message","unknown")[:300])')
            msg="GEMINI_GENERATE=FAIL http=$status error=$safe"
          fi
          curl -sS -X POST --data-binary "$msg" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          echo "$msg"
