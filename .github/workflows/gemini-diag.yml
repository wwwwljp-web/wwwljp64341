name: Gemini Key Diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: test key without exposing it
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_DIAG_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_DIAG_TOPIC }}
        run: |
          set +x
          body=$(curl -sS --max-time 40 -w '
%{http_code}' -H "x-goog-api-key: $GEMINI_KEY" 'https://generativelanguage.googleapis.com/v1beta/models')
          status=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')
          if [ "$status" = 200 ]; then
            models=$(printf '%s' "$payload" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(", ".join(x.get("name","").replace("models/","") for x in d.get("models",[]) if "gemini-3.8-flash" in x.get("name","").lower()))')
            msg="GEMINI_DIAG=OK http=200 models=$models"
          else
            safe=$(printf '%s' "$payload" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("error",{}).get("message","unknown")[:300])')
            msg="GEMINI_DIAG=FAIL http=$status error=$safe"
          fi
          curl -sS -X POST --data-binary "$msg" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
